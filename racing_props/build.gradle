plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}
version = '1.0.0'
group = 'com.racingprops'
base { archivesName = 'racingprops' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.172'
    runs {
        client { client() }
        server { server() }
    }
    mods { racingprops { sourceSet sourceSets.main } }
}
